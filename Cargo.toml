[workspace]
members = ["crates/gilfit", "bindings/python"]
# The bindings build through maturin (they need a Python); plain cargo commands check the core.
default-members = ["crates/gilfit"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/iyulab/gilfit"
rust-version = "1.90"
