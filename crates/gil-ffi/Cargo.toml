[package]
name = "gil-ffi"
version.workspace = true
description = "C ABI over the iyulab-gil decision core, for the .NET binding."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The native side of the .NET package; it ships inside NuGet, never to crates.io.
publish = false

[lib]
name = "gil_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
gil = { workspace = true, features = ["serde"] }
iyulab-ffi-support.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
