[package]
name = "gilfit"
version = "0.0.0"
description = "Suggests and decides form field values from how settled documents were filled - the decision core, with no I/O."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
keywords = ["forms", "suggestion", "precision", "replay", "classification"]
categories = ["algorithms", "text-processing"]
# The golden tests read the shared fixtures at the repository root, which a packaged crate does not carry.
exclude = ["tests/"]
# Published only on a release decision; until then this keeps it from being uploaded by accident.
publish = false

[dependencies]
unicode-normalization = "0.1"

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
