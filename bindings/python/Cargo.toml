[package]
name = "gilfit-py"
version = "0.1.0"
description = "Python bindings for the gilfit decision core."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The Rust side of the Python package; it ships to PyPI as wheels, never to crates.io.
publish = false

[lib]
name = "_gilfit"
crate-type = ["cdylib"]

[dependencies]
gilfit = { path = "../../crates/gilfit", version = "0.1.0" }
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
