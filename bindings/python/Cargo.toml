[package]
name = "gil-py"
version = "0.7.0"
description = "Python bindings for the Gil decision core."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# The Rust side of the Python package; it ships to PyPI as wheels, never to crates.io.
publish = false

[lib]
name = "_gil"
crate-type = ["cdylib"]

[dependencies]
gil = { package = "iyulab-gil", path = "../../crates/gil", version = "0.7.0", features = ["serde"] }
serde = "1"
pyo3 = { version = "0.30.1", features = ["abi3-py311"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
