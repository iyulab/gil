[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "iyulab-gil"
description = "Answers the decided attributes of a record from the records people already settled, with the precision each answer layer promises."
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
# The version is the bindings crate's, which inherits the workspace's version line (the root Cargo.toml).
dynamic = ["version"]
keywords = ["forms", "suggestion", "precision", "replay", "classification"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/iyulab/gil"
Changelog = "https://github.com/iyulab/gil/blob/main/crates/gil/CHANGELOG.md"

[tool.maturin]
python-source = "python"
module-name = "gil._gil"
features = ["pyo3/extension-module"]
# maturin lays the sdist out from the workspace root, so the license file the metadata names must be placed at its root.
include = [{ path = "LICENSE", format = "sdist" }]
