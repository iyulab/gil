[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "gilfit"
version = "0.0.0"
description = "Suggests and decides form field values from how settled documents were filled."
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.maturin]
python-source = "python"
module-name = "gilfit._gilfit"
features = ["pyo3/extension-module"]
