name: Publish iyulab-gil

# Publishes the Rust crate to crates.io and the Python package to PyPI when the core crate's version changes, and the
# review crate (iyulab-gil-review) to crates.io when its version changes. The Python package takes the bindings
# crate's version, which follows the core's; a version already on a registry is skipped there, so a rerun finishes
# what an earlier run left undone. The .NET packages, Gil.Review among them, publish from publish.yml.

on:
  push:
    branches: [main, rust-core]
    paths: [crates/gil/Cargo.toml, crates/gil-review/Cargo.toml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-iyulab-gil
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.read.outputs.version }}
      crate: ${{ steps.registries.outputs.crate }}
      pypi: ${{ steps.registries.outputs.pypi }}
      review: ${{ steps.read.outputs.review }}
      review-crate: ${{ steps.registries.outputs.review-crate }}
    steps:
      - uses: actions/checkout@v7

      - name: Read the version
        id: read
        run: |
          core=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gil/Cargo.toml)
          bindings=$(sed -n 's/^version = "\(.*\)"/\1/p' bindings/python/Cargo.toml)
          if [ "$core" != "$bindings" ]; then
            echo "::error::crates/gil is $core but bindings/python is $bindings; they share one version line."
            exit 1
          fi
          echo "version=$core" >> "$GITHUB_OUTPUT"
          review=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gil-review/Cargo.toml)
          binding=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' bindings/csharp/Gil.Review/Gil.Review.csproj)
          if [ "$review" != "$binding" ]; then
            echo "::error::crates/gil-review is $review but Gil.Review is $binding; they share one version line."
            exit 1
          fi
          echo "review=$review" >> "$GITHUB_OUTPUT"

      # 0.0.0 is the unreleased placeholder; anything else is published where the registry does not have it yet.
      - name: Check the registries
        id: registries
        env:
          VERSION: ${{ steps.read.outputs.version }}
          REVIEW: ${{ steps.read.outputs.review }}
        run: |
          agent="iyulab-gil-release (https://github.com/iyulab/gil)"
          if [ "$REVIEW" = "0.0.0" ]; then
            echo "review-crate=false" >> "$GITHUB_OUTPUT"
          else
            review=$(curl -s -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/iyulab-gil-review/$REVIEW")
            echo "crates.io iyulab-gil-review $review (200 = already published)"
            echo "review-crate=$([ "$review" = 200 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          fi
          if [ "$VERSION" = "0.0.0" ]; then
            echo "crate=false" >> "$GITHUB_OUTPUT"; echo "pypi=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          crate=$(curl -s -o /dev/null -w '%{http_code}' -A "$agent" "https://crates.io/api/v1/crates/iyulab-gil/$VERSION")
          echo "crates.io $crate (200 = already published)"
          echo "crate=$([ "$crate" = 200 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          # A PyPI version is complete once its sdist is there: it uploads after the wheels, and the upload skips
          # files PyPI already has, so a version left with some wheels and no sdist is finished by running again.
          files=$(curl -s "https://pypi.org/pypi/iyulab-gil/$VERSION/json" | jq -r '.urls[]?.filename' || true)
          if grep -qx "iyulab_gil-$VERSION.tar.gz" <<< "$files"; then pypi=false; else pypi=true; fi
          echo "PyPI files: $(wc -w <<< "$files") · sdist present: $([ "$pypi" = false ] && echo yes || echo no)"
          echo "pypi=$pypi" >> "$GITHUB_OUTPUT"

  crate:
    needs: version
    if: needs.version.outputs.crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p iyulab-gil

  review-crate:
    needs: version
    if: needs.version.outputs.review-crate == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # the release tag
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --locked -p iyulab-gil-review
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked -p iyulab-gil-review
      - env:
          TAG: iyulab-gil-review-v${{ needs.version.outputs.review }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi

  # One abi3 wheel per platform (Python 3.11 and later). Public repository: runner minutes are not billed.
  wheels:
    needs: version
    if: needs.version.outputs.pypi == 'true'
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: aarch64, manylinux: "2_28" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: 1.15.0
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --locked -m bindings/python/Cargo.toml -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl
          retention-days: 1

  sdist:
    needs: version
    if: needs.version.outputs.pypi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1.51.0
        with:
          maturin-version: 1.15.0
          command: sdist
          args: -m bindings/python/Cargo.toml -o dist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 1

  pypi:
    needs: [version, wheels, sdist]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@v1.14.3
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist
          skip-existing: true
      # The files now live on PyPI; the run's copies are not kept.
      - uses: geekyeggo/delete-artifact@v6.0.0
        with:
          name: |
            wheels-*
            sdist

  tag:
    needs: [version, crate, pypi]
    # Tags once each registry that needed this version has it (a skipped job counts as done).
    if: >-
      always() && needs.version.result == 'success' && needs.version.outputs.version != '0.0.0' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - env:
          TAG: iyulab-gil-v${{ needs.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
