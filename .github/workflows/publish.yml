name: Publish

# Publishes to NuGet.org when the version in Directory.Build.props changes on main, and Gil.Review when its
# version changes (it shares a version line with the iyulab-gil-review crate, published from publish-gil.yml;
# 0.0.0 is the unreleased placeholder and publishes nothing). Packing is switched on in Directory.Build.props
# (IsPackable); while it is off this workflow builds and tests, finds no packages, and ends without publishing.
# Gil and Gil.Review carry their native libraries for six runtimes: the native workflow builds them first, and
# its consumers must pass before anything is published. A version already on NuGet.org is skipped.

on:
  push:
    branches: [main]
    paths: [Directory.Build.props, bindings/csharp/Gil.Review/Gil.Review.csproj]
  workflow_dispatch:

permissions:
  contents: write # the release tag

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  native:
    uses: ./.github/workflows/native.yml

  publish:
    needs: native
    runs-on: ubuntu-latest
    # A publish run takes about a minute (restore, build, test, pack, push).
    timeout-minutes: 15
    env:
      # Keeps first-run notices out of the output the version step captures.
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      # Every MSBuild call reads it as a property: Gil packs the libraries under it (and is packable only with it).
      GilNativeRoot: ${{ github.workspace }}/native
      GilReviewNativeRoot: ${{ github.workspace }}/native
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: native
          merge-multiple: true

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore Gil.slnx

      - name: Read the version
        id: version
        run: echo "version=$(dotnet msbuild src/Gil/Gil.csproj -getProperty:Version)" >> "$GITHUB_OUTPUT"

      # The Gil project copies the decision core's native library from target/debug; the tests load it.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p gil-ffi -p gil-review-ffi --locked

      - run: dotnet build Gil.slnx --no-restore --configuration Release
      - run: dotnet test --solution Gil.slnx --no-build --configuration Release
      - run: dotnet pack Gil.slnx --no-build --configuration Release --output packages

      # Gil.Review, unless its version line is still the placeholder.
      - name: Gil.Review
        run: |
          review=$(dotnet msbuild bindings/csharp/Gil.Review/Gil.Review.csproj -getProperty:Version)
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/gil-review/Cargo.toml)
          if [ "$review" != "$crate" ]; then
            echo "::error::Gil.Review is $review but crates/gil-review is $crate; they share one version line."
            exit 1
          fi
          if [ "$review" = "0.0.0" ]; then
            echo "Gil.Review is unreleased (0.0.0); not packed."
            exit 0
          fi
          dotnet test --solution bindings/csharp/Gil.Review.slnx --configuration Release
          dotnet pack bindings/csharp/Gil.Review/Gil.Review.csproj --configuration Release --output packages

      # Every packable project under src/ must produce a package of this version; none at all means packing is off.
      - name: Check the packages
        id: packages
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          shopt -s nullglob
          produced=(packages/*.nupkg)
          if [ ${#produced[@]} -eq 0 ]; then
            echo "::notice::Packing is switched off (IsPackable is false), so nothing is published."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=0
          for csproj in $(grep -oP '(?<=Path=")src/[^"]+\.csproj' Gil.slnx); do
            id=$(basename "$csproj" .csproj)
            if [ "$(dotnet msbuild "$csproj" -getProperty:IsPackable)" = "false" ]; then
              # A package that depends on it would point at a version that is never published.
              for pkg in "${produced[@]}"; do
                if unzip -p "$pkg" '*.nuspec' | grep -q "<dependency id=\"${id}\""; then
                  echo "::error::$(basename "$pkg") depends on ${id}, which is not packed"
                  missing=1
                fi
              done
              echo "${id} is not packable; skipped."
              continue
            fi
            if [ ! -f "packages/${id}.${VERSION}.nupkg" ]; then
              echo "::error::${id}.${VERSION}.nupkg was not produced"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ]
          echo "publish=true" >> "$GITHUB_OUTPUT"

      # Symbol packages (.snupkg) next to each package are pushed with it.
      - name: Push to NuGet.org
        if: steps.packages.outputs.publish == 'true'
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: |
          dotnet nuget push "packages/*.nupkg" \
            --api-key "$NUGET_API_KEY" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

      - name: Tag the release
        if: steps.packages.outputs.publish == 'true'
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null; then
            echo "$TAG already exists."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
