name: CI

on:
  push:
    # rust-core is the long-lived branch of the Rust core port; it changes the shared goldens, so it runs CI before it merges.
    branches: [main, rust-core]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Relative links in the Markdown resolve, and the READMEs that ship in packages link other files by URL.
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check-doc-links.py

  # Published text names nothing only the authors can look up: an internal ticket, decision or experiment id, a cycle
  # number, a working-document path, an absolute local path.
  hygiene:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: iyulab/dotnet-ci-actions/internal-token-scan@92c282e839be5e4957fd68fe763b7acc3d088f06
        with:
          extensions: rs,pyi,h,cs,md,py,csproj,props,slnx,yml,yaml,json,jsonl,sh,ps1,toml,txt
          exclude-dirs: .git,bin,obj,node_modules,dist,.venv,TestResults,coverage,target
          extra-patterns: |
            \bEM-\d+\b
            \bD\d{3}-\d+\b
            \bR-\d{4}[a-z]?\b

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      # The decision core's native library (crates/gil-ffi), which the Gil project copies from target/debug when it builds.
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo build -p gil-ffi --locked

      - run: dotnet restore Gil.slnx
      - run: dotnet build Gil.slnx --no-restore --configuration Release
      # Compatibility replays and live calls skip themselves: their fixtures and endpoints are not part of this repository.
      - run: dotnet test --solution Gil.slnx --no-build --configuration Release

  # The Rust decision core (crates/gil): format, lints, and the language-neutral goldens it shares with .NET.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --locked
      # The published crates' documentation builds without a warning (an ambiguous intra-doc link fails here, not on docs.rs).
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      # The optional serde feature: what a host keeps reads back as written.
      - run: cargo test --locked --all-features
      # The declared minimum Rust version (workspace rust-version) builds and passes the core's tests.
      - run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$msrv" --profile minimal
          cargo +"$msrv" test --locked

      # The review statistics' .NET binding (bindings/csharp): its native library from crates/gil-review-ffi, then its
      # tests, which reproduce the review golden through the C ABI. Nothing is packed. The decision core's .NET binding
      # (src/Gil) is tested by the build job.
      - run: cargo build -p gil-review-ffi --locked
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --solution bindings/csharp/Gil.Review.slnx

      # The Python bindings (bindings/python): built as a wheel and tested against the same goldens. Nothing is published.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: cargo clippy -p gil-py --all-targets --locked -- -D warnings
      - run: pip install maturin==1.15.0 pytest mypy==2.4.0
      - run: maturin build --release --locked -m bindings/python/Cargo.toml -o dist
      - run: pip install dist/*.whl && pytest -q bindings/python/tests
      # The extension module's type stubs match what it exports.
      - run: python -m mypy.stubtest gil
