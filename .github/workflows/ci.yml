name: CI

on:
  push:
    # rust-core is the long-lived branch of the Rust core port; it changes the shared goldens, so it runs CI before it merges.
    branches: [main, rust-core]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - run: dotnet restore Gil.slnx
      - run: dotnet build Gil.slnx --no-restore --configuration Release
      # Compatibility replays and live calls skip themselves: their fixtures and endpoints are not part of this repository.
      - run: dotnet test --solution Gil.slnx --no-build --configuration Release

  # The Rust decision core (crates/gilfit): format, lints, and the language-neutral goldens it shares with .NET.
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
